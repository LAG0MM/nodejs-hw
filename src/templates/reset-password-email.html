<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #222">
    <h1>Hello, {{name}}!</h1>
    <p>You requested a password reset.</p>
    <p>
      Click the link below to reset your password. The link is valid for 15
      minutes.
    </p>
    <p>
      <a href="{{link}}" style="color: #4287f5">Reset password</a>
    </p>
    <p>If you did not request this, just ignore this email.</p>
  </body>
</html>
